services:
  django:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DEBUG: True
      S3_MEDIA_ROOT: s3+http://test:test@host.docker.internal:4566/bucket
      AWS_S3_CUSTOM_DOMAIN: localhost:4566/bucket
      AWS_S3_URL_PROTOCOL: "http:"
    extra_hosts:
      - host.docker.internal:host-gateway

  storage:
    image: ministackorg/ministack:latest
    ports:
      - 4566:4566
    environment:
      S3_PERSIST: 1
      S3_DATA_DIR: /data
    volumes:
      - ./init.d/aws:/etc/localstack/init/ready.d:ro
      - ./media/bucket:/data/000000000000/bucket
