<div>
  {% if widget.is_initial %}{{ widget.initial_text }}: <a href="{{ widget.value.url }}">{{ widget.value }}</a>{% if not widget.required %}
  <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.attrs.checked %} checked{% endif %}>
  <label for="{{ widget.checkbox_id }}">{{ widget.clear_checkbox_label }}</label>{% endif %}<br>
  {{ widget.input_text }}:{% endif %}
  <div class="uppy-widget" data-target="{{ uppy.target_id }}" id="{{ uppy.id }}" data-uppy-config="{{ uppy.config }}" data-uppy-plugins="{{ uppy.plugins }}"></div>
  <input type="hidden" name="{{ widget.name }}"{% if widget.value != None %} value="{{ widget.value|stringformat:'s' }}"{% endif %}  {% include "django/forms/widgets/attrs.html" %}>
</div>
